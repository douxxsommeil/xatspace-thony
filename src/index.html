<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DouxSommeil | Xatspace</title>
<script>
  /* Titulo segun idioma del navegador: es -> "DouxSommeil | perfil-xat", resto -> "DouxSommeil | Xatspace" */
  (function () {
    var lang = (navigator.languages && navigator.languages[0]) || navigator.language || '';
    if (/^es\b/i.test(lang)) document.title = 'DouxSommeil | perfil-xat';
  })();
</script>
<link rel="icon" href="assets/cover.jpg" type="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

<div id="loader">

  <div class="bar"><div class="fill" id="loaderFill"></div></div>
</div>

<div id="stage">
  <canvas id="gl" aria-hidden="true"></canvas>
  <canvas id="ascii"></canvas>
</div>


<div id="nowPlaying" role="status" aria-live="polite">
  <img id="npCover" alt="Caratula del album">
  <div>
    <div class="np-sub">AHORA SE ESTA REPRODUCIENDO</div>
    <div class="np-title" id="npTitle"></div>
    <div class="np-artist" id="npArtist"></div>
  </div>
</div>

<div id="playGate">
  <div class="play-wrap">
    <button id="playBtn" aria-label="Reproducir">
      <canvas class="play-lens" width="196" height="196" aria-hidden="true"></canvas>
      <span class="play-lens-edge" aria-hidden="true"></span>
      <svg class="play-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M5 2.8L17 10L5 17.2V2.8Z" fill="#e8e8e6"/>
      </svg>
    </button>
    <div class="play-label">
      <span class="play-word">escuchar</span>
      <span class="play-hint">ENTER</span>
    </div>
  </div>
</div>

<div id="spotifyPanel">
  <div class="spotify-frame-wrap pl-player">
    <div class="pl-header">
      <img id="plCover" alt="Caratula del album">
      <div class="pl-headtext">
        <div id="plTitle" class="pl-title"></div>
        <div id="plArtist" class="pl-artist"></div>
      </div>
    </div>
    <ol id="plList" class="pl-list" aria-label="Lista de canciones"></ol>
    <div class="pl-bar">
      <button id="plPlayBtn" class="pl-play" aria-label="Reproducir" title="Reproducir/Pausar">
        <svg id="plPlayIcon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="pl-barinfo">
        <div id="plBarTitle" class="pl-bar-title"></div>
        <div id="plBarTime" class="pl-bar-time">0:00</div>
      </div>
    </div>
  </div>
</div>

    <div class="avatar-wrap">
      <img id="avatarImg" src="" alt="Thony">
    </div>
    <div class="card-text">
      <div class="name-row" id="nameRow">
        <span class="name-glitch" id="nameGlitch"></span>

    </div>

      <button class="spotify-toggle" id="spotifyToggle" aria-label="Abrir lista de reproducción" title="Abrir lista de reproducción">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>

  </div>
</div>

</html>
